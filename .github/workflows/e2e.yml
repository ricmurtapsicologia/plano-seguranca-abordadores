name: E2E Plano de Segurança do Abordador
on:
  push:
    branches: [main]
    paths:
      - 'tests/e2e.spec.js'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run E2E against public GitHub Pages
        run: npx playwright test tests/e2e.spec.js --browser=chromium --reporter=line --workers=1
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
